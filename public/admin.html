<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MealRescue | Admin Dashboard</title>
    <link rel="stylesheet" href="/public/css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><div class="brand-mark">M</div><span>MealRescue</span></div>
        <div class="nav-links">
          <span id="user-pill" class="small"></span>
          <button id="logout-btn" class="button danger">Logout</button>
        </div>
      </div>
    </header>

    <div class="container">
      <section class="section">
        <div class="card-grid" id="stats-grid"></div>
      </section>

      <section class="section grid-two">
        <div class="table-card">
          <h2>Pending organization verification</h2>
          <div id="org-list"></div>
        </div>
        <div class="list-card">
          <h2>Activity</h2>
          <div class="small">Platform-wide overview and verification controls are listed here.</div>
        </div>
      </section>
    </div>

    <script src="/public/js/app.js"></script>
  </body>
</html>
